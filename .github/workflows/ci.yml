name: Verify Loom
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Install ripgrep
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v rg >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew install ripgrep; fi
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { throw 'ripgrep is required for LOCAL exploration' }
      - name: Format
        run: cargo fmt --manifest-path custom-tui/Cargo.toml -- --check
      - name: Test
        run: cargo test --locked --manifest-path custom-tui/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path custom-tui/Cargo.toml --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --manifest-path custom-tui/Cargo.toml
      - name: Terminal interactions (no model calls)
        if: runner.os != 'Windows'
        run: python3 custom-tui/tests/terminal_smoke.py
      - name: Windows launcher and LOCAL search
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUSTOM_TUI_PROFILE: debug
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
          & .\scripts\loom.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
          & .\scripts\loom.cmd --explore AgentEvent
          if ($LASTEXITCODE -ne 0) { throw 'Windows LOCAL exploration failed' }
      - name: Windows Codex npm launch and owned runtime cleanup (no inference)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUSTOM_TUI_PROFILE: debug
        run: |
          npm.cmd install --global @openai/codex@0.159.3
          if ($LASTEXITCODE -ne 0) { throw 'Codex installation failed' }
          codex.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Codex npm launcher failed' }
          $loomProbeDir = Join-Path $env:RUNNER_TEMP 'loom runtime probe'
          New-Item -ItemType Directory -Force $loomProbeDir | Out-Null
          & .\scripts\loom.cmd --cwd $loomProbeDir --probe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex runtime probe failed' }
