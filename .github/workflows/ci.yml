name: Verify Loom
on:
  push:
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install ripgrep
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v rg >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew install ripgrep; fi
      - name: Install the Linux command sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command rg -ErrorAction SilentlyContinue) { rg --version; exit 0 }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Get-Command rg -ErrorAction SilentlyContinue)) {
              rg --version
              exit $LASTEXITCODE
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw 'ripgrep installation failed after three attempts; refusing to run tests without rg'
      - name: Core tests
        run: cargo test --locked --manifest-path loom-core/Cargo.toml -- --test-threads=1
      - name: TUI tests
        run: cargo test --locked --manifest-path loom-tui/Cargo.toml -- --test-threads=1
      - name: Self-check (headless UI scenarios)
        run: cargo run --locked --quiet --manifest-path loom-tui/Cargo.toml -- --self-check
      - name: Remote control through the real TUI (demo, no model)
        if: runner.os != 'Windows'
        run: python3 loom-tui/tests/remote_smoke.py
  remote-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/loom-browser" playwright@1.62.1
          "$RUNNER_TEMP/loom-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Phone browser interaction tests
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/loom-browser/node_modules/playwright
        run: node --test loom-tui/tests/remote_browser.mjs
