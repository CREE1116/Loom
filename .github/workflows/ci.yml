name: Verify Loom
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install ripgrep
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v rg >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew install ripgrep; fi
      - name: Install the Linux command sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
      - name: Core tests
        run: cargo test --locked --manifest-path loom-core/Cargo.toml
      - name: TUI tests
        run: cargo test --locked --manifest-path loom-tui/Cargo.toml
      - name: Self-check (headless UI scenarios)
        run: cargo run --locked --quiet --manifest-path loom-tui/Cargo.toml -- --self-check
