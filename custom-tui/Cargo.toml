[package]
name = "custom-tui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Loom coding agent runtime and terminal UI"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = "0.24"
toml = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"

tempfile = "3"
