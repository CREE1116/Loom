[package]
name = "loom-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Loom coding agent runtime and terminal UI"

[lib]
name = "loom_tui"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[workspace]

[features]
default = []
cuda = ["loom-core/cuda"]

[dependencies]
loom-core = { path = "../loom-core" }
anyhow = "1"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
shlex = "1.3"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", path = "third_party/crossterm" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
toml = "0.9"
ureq = { version = "2", features = ["json"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

tempfile = "3"
pulldown-cmark = { version = "0.10", default-features = false }
libc = "0.2"
dunce = "1"
