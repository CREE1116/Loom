<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loom">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Loom</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f6f8; --bg3: #eceef2; --fg: #16181d; --fg2: #4b5160; --muted: #8a909c;
    --line: #e4e6eb; --accent: #4f6bed; --accent-fg: #ffffff; --accent-soft: #eef1fe;
    --ok: #1f9d55; --bad: #d64545; --warn: #c27c0e; --code: #f3f4f7; --shadow: 0 8px 30px rgba(15, 17, 21, .12);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --bg2: #171a20; --bg3: #20242c; --fg: #e8eaee; --fg2: #b4b9c4; --muted: #7d8494;
      --line: #262a33; --accent: #7c93ff; --accent-fg: #0f1115; --accent-soft: #1d2340;
      --ok: #4cc38a; --bad: #ff6b6b; --warn: #f0b44c; --code: #151820; --shadow: 0 8px 30px rgba(0, 0, 0, .5);
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15.5px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Header */
  header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); z-index: 2; }
  .brand { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-fg);
    display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .head { flex: 1; min-width: 0; }
  .head .title { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  .head .sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .dot.off { background: var(--bad); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .icon-btn { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--fg2); flex: none; }
  .icon-btn:active { background: var(--bg3); }

  /* Conversation */
  main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 18px 14px 12px; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  /* Long code lines scroll inside their block instead of widening the page. */
  .thread > *, .dock > *, .codeblock, .msg-assistant { min-width: 0; max-width: 100%; }
  .msg-user { align-self: flex-end; max-width: 86% !important; background: var(--accent); color: var(--accent-fg);
    padding: 9px 14px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; word-break: break-word; }
  .msg-user.pending { opacity: .6; }
  .failed-send { align-self: flex-end; max-width: 86%; border: 1px solid var(--bad); border-radius: 12px; padding: 10px 12px; }
  .failed-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .failed-send .reason { color: var(--bad); font-size: 12.5px; overflow-wrap: anywhere; }
  .msg-assistant { word-break: break-word; }
  .msg-assistant > :first-child { margin-top: 0; }
  .msg-assistant > :last-child { margin-bottom: 0; }
  .msg-assistant p { margin: 0 0 .7em; }
  .msg-assistant h1, .msg-assistant h2, .msg-assistant h3 { font-size: 1.05em; margin: 1em 0 .4em; }
  .msg-assistant ul, .msg-assistant ol { margin: 0 0 .7em; padding-left: 1.3em; }
  .msg-assistant li { margin: .15em 0; }
  .msg-assistant blockquote { margin: 0 0 .7em; padding-left: 12px; border-left: 3px solid var(--line); color: var(--fg2); }
  .msg-assistant a { color: var(--accent); }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .88em; background: var(--code);
    padding: .1em .35em; border-radius: 6px; }
  .codeblock { margin: 0 0 .8em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code); }
  .codeblock .bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px;
    font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  .codeblock pre code { background: none; padding: 0; font-size: inherit; }
  .copy { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .working { display: inline-flex; gap: 4px; padding: 6px 0; }
  .working i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .working i:nth-child(2) { animation-delay: .15s; } .working i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  details.tools { border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); }
  details.tools summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    font-size: 13px; color: var(--fg2); cursor: pointer; }
  details.tools summary::-webkit-details-marker { display: none; }
  details.tools summary .last { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  details.tools summary .chev { transition: transform .15s; color: var(--muted); }
  details.tools[open] summary .chev { transform: rotate(90deg); }
  .tool-list { padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 3px; }
  .tool { display: flex; gap: 8px; align-items: baseline; font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg2); min-width: 0; }
  .tool span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark { flex: none; width: 14px; text-align: center; }
  .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.run { color: var(--accent); }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size: 13px; color: var(--muted); white-space: pre-wrap; text-align: center; }
  .empty { margin: 18vh auto 0; text-align: center; color: var(--muted); max-width: 300px; }
  .empty .brand { width: 48px; height: 48px; border-radius: 14px; font-size: 22px; margin: 0 auto 12px; }

  /* Approval */
  .approval { max-width: 760px; margin: 0 auto; border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line));
    background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
  .approval h3 { margin: 0 0 4px; font-size: 14.5px; display: flex; gap: 6px; align-items: center; }
  .approval .sum { color: var(--fg2); font-size: 14px; white-space: pre-wrap; }
  .approval details { margin-top: 6px; }
  .approval details summary { font-size: 13px; color: var(--muted); cursor: pointer; }
  .approval pre { max-height: 36vh; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--code);
    padding: 8px 10px; border-radius: 10px; margin: 6px 0 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 11px; padding: 8px 14px; min-height: 40px; font-weight: 550; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:disabled { opacity: .45; }
  #requests { max-height: 42dvh; overflow: auto; min-width: 0; }
  #approvals, #questions { display: flex; flex-direction: column; gap: 8px; }
  .question-form { min-width: 0; overflow-wrap: anywhere; }
  .question-form fieldset { min-width: 0; border: 0; padding: 0; margin: 10px 0; }
  .question-form legend { font-weight: 600; }
  .question-option { display: block; margin: 6px 0; }
  .question-option .hint { display: block; color: var(--muted); font-size: 12.5px; margin-left: 24px; }
  .question-form textarea { display: block; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .question-form input[type=password] { width: 100%; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  button:disabled { cursor: default; }

  /* Composer */
  footer { flex-shrink: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); }
  .dock { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .queue-count { font-size: 12.5px; color: var(--fg2); overflow-wrap: anywhere; }
  .composer { display: flex; align-items: flex-end; gap: 8px; background: var(--bg2); border: 1px solid var(--line);
    border-radius: 22px; padding: 6px 6px 6px 14px; transition: border-color .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg);
    font: inherit; line-height: 1.45; padding: 7px 0; max-height: 34vh; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
  .send:disabled { background: var(--bg3); color: var(--muted); }
  .send.stop { background: var(--fg); color: var(--bg); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--bg);
    border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--fg2); white-space: nowrap; max-width: 70vw; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  .chip svg { width: 14px; height: 14px; }

  /* Sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82dvh; background: var(--bg); z-index: 11;
    border-radius: 20px 20px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  @media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 520px; margin-left: -260px; bottom: 24px; border-radius: 20px; } }
  .sheet.open { transform: none; }
  .sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; }
  .sheet h2 { margin: 6px 18px 10px; font-size: 16px; }
  .search { margin: 0 14px 8px; display: flex; align-items: center; gap: 8px; background: var(--bg2); border-radius: 12px; padding: 0 12px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; padding: 10px 0; }
  .sheet .body { overflow-y: auto; padding: 0 8px 12px; }
  .group-name { font-size: 12px; color: var(--muted); padding: 10px 12px 4px; text-transform: none; }
  .option { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; }
  .option:active, .option:hover { background: var(--bg2); }
  .option .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option .check { color: var(--accent); visibility: hidden; }
  .option.selected .check { visibility: visible; }
  .option.selected .name { font-weight: 600; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 12px 10px; }
  .seg button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .menu-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; text-align: left; }
  .menu-item:active, .menu-item:hover { background: var(--bg2); }
  .menu-item .hint { font-size: 12.5px; color: var(--muted); }
  .info { margin: 4px 14px 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 12.5px; color: var(--fg2); }

  .toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0;
    background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 12px; font-size: 13.5px; transition: .2s; z-index: 20; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .offline { position: fixed; inset: 0; display: none; place-items: center; background: var(--bg); z-index: 30; text-align: center; padding: 24px; }
  .offline.show { display: grid; }
</style>
</head>
<body>
<header>
  <div class="brand">L</div>
  <div class="head">
    <div class="title" id="title">Loom</div>
    <div class="sub"><span class="dot" id="dot"></span><span id="status">연결 중…</span></div>
  </div>
  <button class="icon-btn" id="menu-btn" aria-label="메뉴">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
  </button>
</header>

<main id="scroller"><div class="thread" id="thread"></div></main>

<footer>
  <div class="dock">
    <div id="requests"><div id="approvals"></div><div id="questions"></div></div>
    <div id="recovery" class="choices" hidden>
      <button class="btn primary" id="retry-model" data-remote-action>이어서 시도</button>
      <span class="queue-count">모델·추론 옵션을 바꾼 뒤 다시 시도할 수 있습니다.</span>
    </div>
    <button class="chip" id="queue-count" hidden></button>
    <div class="chips">
      <button class="chip" id="model-chip"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span id="model-label">모델</span></button>
      <button class="chip" id="effort-chip" hidden><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span id="effort-label"></span></button>
    </div>
    <form class="composer" id="form">
      <textarea id="text" rows="1" placeholder="Loom에게 메시지…" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" aria-label="보내기" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="model-sheet" aria-label="모델 선택">
  <div class="grip"></div>
  <h2>모델</h2>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="model-search" placeholder="검색" autocomplete="off"></label>
  <div class="body" id="model-list"></div>
</section>
<section class="sheet" id="effort-sheet" aria-label="추론 강도">
  <div class="grip"></div>
  <h2>추론 강도</h2>
  <div class="body" id="effort-list"></div>
</section>
<section class="sheet" id="queue-sheet" aria-label="대기열">
  <div class="grip"></div><h2>대기열</h2>
  <div class="info">즉시 보내기는 현재 응답을 중단한 뒤 선택한 메시지를 전송합니다.</div>
  <div class="body" id="queue-list"></div>
</section>
<section class="sheet" id="queue-options-sheet" aria-label="대기 메시지 옵션">
  <div class="grip"></div><h2>대기 메시지 옵션</h2>
  <div class="body" style="padding:14px">
    <label>모델 <select id="queue-model" style="width:100%;min-height:44px"></select></label>
    <label>추론 강도 <select id="queue-effort" style="width:100%;min-height:44px"></select></label>
    <button class="btn primary" id="queue-save" data-remote-action style="margin-top:12px">옵션 저장</button>
  </div>
</section>
<section class="sheet" id="menu-sheet" aria-label="메뉴">
  <div class="grip"></div>
  <div class="body">
    <button class="menu-item" data-action="new" data-remote-action><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><div><div>새 대화</div><div class="hint">기록은 세션 목록에 남습니다</div></div></button>
    <button class="menu-item" data-action="compact" data-remote-action><svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg><div><div>대화 압축</div><div class="hint">지난 대화를 요약해 컨텍스트를 비웁니다</div></div></button>
    <button class="menu-item" id="refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><div><div>새로 고침</div></div></button>
  </div>
  <div class="info" id="conn-info"></div>
</section>

<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div><div class="brand" style="margin:0 auto 12px;width:48px;height:48px;border-radius:14px;font-size:22px">L</div><div id="offline-text">연결할 수 없습니다.</div><button class="btn" id="reconnect" style="margin-top:16px">다시 연결</button></div></div>

<script>
(() => {
  // Keep the token out of the address bar once read; a reload finds it in this tab's storage.
  const fromPath = location.pathname.match(/^\/t\/([A-Za-z0-9]+)/i);
  let token = ((fromPath && fromPath[1]) || new URLSearchParams(location.search).get("t") || "").toUpperCase();
  // Local storage, so the app added to the home screen (which opens "/") finds it too.
  try {
    if (token) localStorage.setItem("loom-token", token);
    else token = localStorage.getItem("loom-token") || "";
  } catch (_) {}
  history.replaceState(null, "", "/");

  const $ = (id) => document.getElementById(id);
  const scroller = $("scroller"), thread = $("thread"), text = $("text"), send = $("send");
  let version = 0, state = null, follow = true, pending = [], failures = 0, connected = false, expired = false;
  const openTools = new Set();
  const failedSends = new Map(), inFlight = new Set(), questionForms = new Map();
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
  let client = newId();
  try {
    client = sessionStorage.getItem("loom-client") || client;
    sessionStorage.setItem("loom-client", client);
  } catch (_) {}

  async function fetchJson(url, options, timeout) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
      const data = await res.json().catch(error => {
        if (res.ok || error.name === "AbortError") throw error;
        // Authentication/proxy errors on the state endpoint may have a plain-text body.
        return { ok: false, error: "요청을 처리하지 못했습니다 (" + res.status + ")." };
      });
      return { res, data };
    } finally { clearTimeout(timer); }
  }

  function syncConnection() {
    $("dot").className = "dot" + (!connected ? " off" : state?.busy ? " busy" : "");
    $("status").textContent = connected ? state?.status || "" : expired
      ? "주소가 만료됐습니다 · 새 QR 코드로 연결하세요."
      : "연결이 끊겼습니다 · 다시 연결 중…";
    updateSend();
    for (const button of document.querySelectorAll("[data-remote-action]")) {
      button.disabled = !connected || button.dataset.blocked === "true" ||
        (button.dataset.action && inFlight.has(button.dataset.action + ":"));
    }
  }

  function expireToken() {
    expired = true;
    connected = false;
    $("offline-text").textContent = "주소가 만료됐거나 올바르지 않습니다. 컴퓨터의 Loom에서 /remote로 새 QR 코드를 표시하고, 새 주소를 여세요.";
    $("offline").classList.add("show");
    syncConnection();
  }

  // Rejections propagate to the caller, which owns its draft/retry controls.
  // A transport error may mean the app already accepted the request: never auto-retry POST.
  async function action(body) {
    if (!connected) throw new Error("연결을 확인한 뒤 다시 시도하세요.");
    let result;
    try {
      result = await fetchJson("/api/action", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ ...body, request_id: body.request_id || newId() }),
      }, 10000);
    } catch (_) {
      connected = false;
      syncConnection();
      throw new Error("전송 여부를 확인할 수 없습니다. 대화를 확인한 뒤 다시 시도하세요.");
    }
    if (result.res.status === 401) expireToken();
    if (!result.res.ok || result.data.ok !== true) {
      throw new Error(result.data.error || "요청을 처리하지 못했습니다 (" + result.res.status + ").");
    }
    return result.data;
  }

  async function command(body, message) {
    const key = body.action + ":" + (body.id || "");
    if (inFlight.has(key)) return;
    inFlight.add(key);
    if (state) render();
    try {
      await action(body);
      if (message) toast(message);
      closeSheet();
    } catch (error) { toast(error.message); }
    finally {
      inFlight.delete(key);
      if (state) render();
    }
  }

  function toast(message) {
    const t = $("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function h(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c != null) node.append(c.nodeType ? c : String(c));
    return node;
  }

  // ---- Markdown (escaped first; only a safe subset becomes markup) ----
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function markdown(src) {
    const root = document.createElement("div");
    const lines = (src || "").replace(/\r/g, "").split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^\s*```\s*([\w+-]*)/);
      if (fence) {
        const body = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
        i++;
        const code = body.join("\n");
        const copy = h("button", { class: "copy", onclick: () => { navigator.clipboard?.writeText(code); toast("복사했습니다"); } }, "복사");
        root.append(h("div", { class: "codeblock" }, h("div", { class: "bar" }, fence[1] || "code", copy), h("pre", {}, h("code", {}, code))));
        continue;
      }
      if (!line.trim()) { i++; continue; }
      const head = line.match(/^(#{1,6})\s+(.*)/);
      if (head) { const el = document.createElement("h" + Math.min(head[1].length + 1, 4)); el.innerHTML = inline(head[2]); root.append(el); i++; continue; }
      const list = line.match(/^\s*([-*+]|\d+[.)])\s+/);
      if (list) {
        const ordered = /\d/.test(list[1]);
        const el = document.createElement(ordered ? "ol" : "ul");
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          const li = document.createElement("li");
          li.innerHTML = inline(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
          el.append(li);
          i++;
        }
        root.append(el);
        continue;
      }
      if (/^\s*>/.test(line)) {
        const quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ""));
        const el = document.createElement("blockquote");
        el.innerHTML = inline(quote.join(" "));
        root.append(el);
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|[-*+]\s|\d+[.)]\s|>)/.test(lines[i])) para.push(lines[i++]);
      if (!para.length) para.push(lines[i++]);
      const p = document.createElement("p");
      p.innerHTML = para.map(inline).join("<br>");
      root.append(p);
    }
    return root.childNodes.length ? Array.from(root.childNodes) : [];
  }

  // ---- Rendering ----
  function toolMark(status) {
    if (status === "inProgress") return h("span", { class: "mark run" }, h("span", { class: "spin" }));
    if (status === "failed") return h("span", { class: "mark bad" }, "!");
    return h("span", { class: "mark ok" }, "✓");
  }

  function renderThread() {
    const entries = state.entries || [];
    const nodes = [];
    let group = null;
    const flush = () => {
      if (!group) return;
      const { items, key } = group;
      const running = items.some((e) => e.status === "inProgress");
      const failed = items.filter((e) => e.status === "failed").length;
      const last = items[items.length - 1];
      const d = h("details", { class: "tools", open: openTools.has(key) },
        h("summary", {},
          running ? h("span", { class: "mark run" }, h("span", { class: "spin" })) : toolMark(failed ? "failed" : "completed"),
          h("span", {}, `작업 ${items.length}개`),
          h("span", { class: "last" }, last.title),
          h("svg", { viewBox: "0 0 24 24", class: "chev" })),
        h("div", { class: "tool-list" }, items.map((e) => h("div", { class: "tool" }, toolMark(e.status), h("span", {}, e.title || "도구")))));
      d.querySelector(".chev").innerHTML = '<path d="M9 6l6 6-6 6"/>';
      d.addEventListener("toggle", () => d.open ? openTools.add(key) : openTools.delete(key));
      nodes.push(d);
      group = null;
    };
    for (const e of entries) {
      if (e.kind === "tool" || e.kind === "change") {
        if (!group) group = { key: e.id, items: [] };
        group.items.push(e);
        continue;
      }
      flush();
      if (e.kind === "user") nodes.push(h("div", { class: "msg-user" }, e.body));
      else if (e.kind === "assistant") {
        const body = (e.body || "").trim();
        if (body) nodes.push(h("div", { class: "msg-assistant" }, markdown(body)));
        else if (e.status === "inProgress") nodes.push(h("div", { class: "working" }, h("i"), h("i"), h("i")));
      } else {
        const t = [e.title, e.body].filter(Boolean).join("\n");
        if (t) nodes.push(h("div", { class: "note" }, t));
      }
    }
    flush();
    // Pending means a request is in flight, never a permanent optimistic message.
    for (const p of pending) nodes.push(h("div", { class: "msg-user pending" }, p.text));
    for (const message of failedSends.values()) {
      nodes.push(h("div", { class: "failed-send" },
        h("div", { class: "failed-text" }, message.text),
        h("div", { class: "reason" }, message.error),
        h("div", { class: "choices" },
          h("button", { class: "btn retry-send", "data-remote-action": true,
            onclick: () => sendMessage(message) }, "다시 보내기"),
          h("button", { class: "btn", onclick: () => { failedSends.delete(message.request_id); render(); } }, "닫기"))));
    }
    if (state.busy && !nodes.some((n) => n.classList?.contains("working")) && !entries.some((e) => e.kind === "assistant" && e.status === "inProgress" && (e.body || "").trim()))
      nodes.push(h("div", { class: "working" }, h("i"), h("i"), h("i")));
    if (!nodes.length) {
      nodes.push(h("div", { class: "empty" }, h("div", { class: "brand" }, "L"), h("div", {}, "무엇을 도와드릴까요?"),
        h("div", { style: "font-size:13px;margin-top:4px" }, "이 기기에서 보낸 메시지는 컴퓨터의 Loom에서 실행됩니다.")));
    }
    thread.replaceChildren(...nodes);
  }

  function renderApprovals() {
    const box = $("approvals");
    box.replaceChildren(...(state.approvals || []).map((a) => {
      const choices = a.choices.map((c, i) => h("button", {
        class: "btn" + (i === 0 ? " primary" : ""), "data-remote-action": true,
        "data-blocked": String(a.answering || inFlight.has("reply:" + a.id)),
        onclick: () => command({ action: "reply", id: a.id, choice: c.result }),
      }, c.label));
      return h("div", { class: "approval" },
        h("h3", {}, "⚠︎ ", a.title || "승인 요청"),
        a.summary ? h("div", { class: "sum" }, a.summary) : null,
        a.detail ? h("details", {}, h("summary", {}, "자세히"), h("pre", {}, a.detail)) : null,
        h("div", { class: "choices" }, choices));
    }));
  }

  function renderQuestions() {
    const box = $("questions");
    const requests = state.questions || [];
    const live = new Set(requests.map(r => r.id));
    for (const [id, form] of questionForms) {
      if (!live.has(id)) { form.node.remove(); questionForms.delete(id); }
    }
    requests.forEach((request, index) => {
      const signature = JSON.stringify([request.blocking, request.questions]);
      let form = questionForms.get(request.id);
      if (!form || form.signature !== signature) {
        form?.node.remove();
        form = { signature, request, fields: [] };
        form.node = h("form", { class: "approval question-form", "data-request-id": request.id },
          h("h3", {}, request.blocking ? "질문에 답해주세요" : "질문"));
        for (const q of request.questions) {
          const field = { question: q, mode: null, option: null };
          const name = "question-" + newId();
          const fieldset = h("fieldset", {}, h("legend", {}, q.header || q.id), h("div", {}, q.prompt));
          q.options.forEach((option, i) => {
            const radio = h("input", { type: "radio", name, value: i,
              onchange: () => { field.mode = "option"; field.option = i; form.refresh(); } });
            fieldset.append(h("label", { class: "question-option" }, radio, " ", option.label,
              option.description ? h("span", { class: "hint" }, option.description) : null));
          });
          if (q.allow_custom) {
            const radio = h("input", { type: "radio", name, value: "custom",
              onchange: () => { field.mode = "text"; form.refresh(); field.input.focus(); } });
            field.input = h(q.secret ? "input" : "textarea", {
              ...(q.secret ? { type: "password" } : { rows: 2 }),
              "aria-label": (q.header || q.id) + " 직접 입력", autocomplete: "off",
              oninput: () => { field.mode = "text"; radio.checked = true; form.refresh(); },
            });
            fieldset.append(h("label", { class: "question-option" }, radio, " 직접 입력"), field.input);
          }
          form.fields.push(field);
          form.node.append(fieldset);
        }
        const answers = () => form.fields.map(field => ({ question_id: field.question.id,
          ...(field.mode === "option" ? { option: field.option } : { text: field.input?.value || "" }) }));
        form.submit = h("button", { type: "submit", class: "btn primary submit-answers", "data-remote-action": true }, "답변 보내기");
        form.cancel = h("button", { type: "button", class: "btn cancel-questions", "data-remote-action": true,
          onclick: () => command({ action: "cancel_questions", id: request.id }) }, "취소");
        form.node.append(h("div", { class: "choices" }, form.submit, form.cancel));
        form.refresh = () => {
          const locked = form.request.answering || inFlight.has("answer:" + request.id) || inFlight.has("cancel_questions:" + request.id);
          const complete = form.fields.every(field => field.mode === "option" ||
            (field.mode === "text" && field.input.value.trim() && new TextEncoder().encode(field.input.value).length <= 16384));
          form.submit.dataset.blocked = String(!!locked || !complete);
          form.cancel.dataset.blocked = String(!!locked);
          for (const input of form.node.querySelectorAll("input, textarea")) input.disabled = !connected || !!locked;
          syncConnection();
        };
        form.node.addEventListener("submit", ev => {
          ev.preventDefault();
          if (!form.submit.disabled) command({ action: "answer", id: request.id, answers: answers() });
        });
        questionForms.set(request.id, form);
      }
      form.request = request;
      // Keep existing inputs attached: polling must preserve focus, selection and secret drafts.
      if (box.children[index] !== form.node) box.insertBefore(form.node, box.children[index] || null);
      form.refresh();
    });
  }

  function render() {
    $("title").textContent = state.title || "Loom";
    const queued = state.queued || 0;
    $("queue-count").hidden = queued === 0;
    $("queue-count").setAttribute("aria-label", "대기열 " + queued + "개");
    $("queue-count").textContent = queued > 0
      ? "대기열 " + queued + "개" + (state.queue_paused ? " · 일시정지" : "") + (state.questions?.length ? " · 질문에 답해주세요." : "") : "";
    $("model-label").textContent = state.model_label || state.model || "모델";
    const efforts = state.efforts || [];
    $("effort-chip").hidden = !efforts.length;
    $("effort-label").textContent = efforts.find((e) => e.value === state.effort)?.value || state.effort || "기본";
    $("conn-info").textContent = state.public
      ? "인터넷(HTTPS)으로 연결됨 · 이 주소를 아는 사람은 Loom을 조작할 수 있습니다."
      : "같은 네트워크로 연결됨 · 암호화되지 않은 연결입니다. 믿을 수 있는 네트워크에서만 쓰세요.";
    $("recovery").hidden = !state.recovery || state.busy;
    updateSend();
    const atBottom = follow;
    renderThread();
    renderApprovals();
    renderQuestions();
    if (atBottom) requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
    if (sheetOpen === "model-sheet") renderModels();
    if (sheetOpen === "effort-sheet") renderEfforts();
    if (sheetOpen === "queue-sheet") renderQueue();
    syncConnection();
  }

  function updateSend() {
    const busy = state?.busy && !text.value.trim();
    send.classList.toggle("stop", !!busy);
    send.disabled = !connected || (!busy && !text.value.trim()) || inFlight.has("interrupt:");
    send.setAttribute("aria-label", busy ? "중지" : "보내기");
    send.innerHTML = busy
      ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  }

  let queueEdit = null;
  function queueBody(action, item) {
    return { action, index: item.index, revision: state.queue_revision };
  }
  function renderQueue() {
    const nodes = [];
    if (state.queue_paused) nodes.push(h("button", { class: "btn", "data-remote-action": true,
      onclick: () => command({ action: "queue_resume" }, "대기열 전송을 재개합니다") }, "대기열 재개"));
    for (const item of state.queue || []) {
      // Capture the displayed revision; an updated queue must never redirect an old click.
      const revision = state.queue_revision;
      nodes.push(h("div", { class: "approval" }, h("div", { class: "failed-text" }, item.text),
        h("div", { class: "queue-count" }, (item.model_label || item.model) + " · " + (item.effort || "기본")
          + (item.images ? " · 이미지 " + item.images + "개" : "") + (item.skills ? " · 스킬 " + item.skills + "개" : "")),
        h("div", { class: "choices" },
          h("button", { class: "btn primary", "data-remote-action": true,
            onclick: () => command({ ...queueBody("queue_send", item), revision }, "선택한 메시지를 우선 전송합니다") }, "즉시 보내기"),
          h("button", { class: "btn", onclick: () => editQueue(item, revision) }, "옵션 변경"),
          h("button", { class: "btn", "data-remote-action": true,
            onclick: () => command({ ...queueBody("queue_remove", item), revision }, "대기 메시지를 삭제했습니다") }, "삭제"))));
    }
    if (!nodes.length) nodes.push(h("div", { class: "info" }, "대기 중인 메시지가 없습니다."));
    $("queue-list").replaceChildren(...nodes);
  }
  function queueEfforts(value = "") {
    const model = (state.models || []).find(m => m.id === $("queue-model").value);
    $("queue-effort").replaceChildren(...[{ value: "", description: "기본" }, ...(model?.efforts || [])]
      .map(e => h("option", { value: e.value }, e.value || e.description)));
    $("queue-effort").value = value;
    if ($("queue-effort").selectedIndex < 0) $("queue-effort").value = "";
  }
  function editQueue(item, revision) {
    queueEdit = { ...queueBody("queue_update", item), revision };
    $("queue-model").replaceChildren(...(state.models || []).map(m => h("option", { value: m.id }, m.label)));
    $("queue-model").value = item.model;
    queueEfforts(item.effort || "");
    openSheet("queue-options-sheet");
  }
  $("queue-model").onchange = () => queueEfforts();
  $("queue-save").onclick = () => {
    if (queueEdit) command({ ...queueEdit, model: $("queue-model").value, effort: $("queue-effort").value }, "대기 메시지 옵션을 변경했습니다");
  };
  $("queue-count").onclick = () => { renderQueue(); openSheet("queue-sheet"); };
  $("retry-model").onclick = () => command({ action: "retry" }, "이전 요청을 이어서 시도합니다");

  // ---- Sheets ----
  let sheetOpen = null;
  function openSheet(id) {
    closeSheet();
    sheetOpen = id;
    $("scrim").classList.add("open");
    $(id).classList.add("open");
    if (id === "model-sheet") { $("model-search").value = ""; renderModels(); }
    if (id === "effort-sheet") renderEfforts();
  }
  function closeSheet() {
    if (!sheetOpen) return;
    $(sheetOpen).classList.remove("open");
    $("scrim").classList.remove("open");
    sheetOpen = null;
  }
  $("scrim").onclick = closeSheet;

  function renderModels() {
    const q = $("model-search").value.trim().toLowerCase();
    const groups = new Map();
    for (const m of state?.models || []) {
      if (q && !(m.label + " " + m.id).toLowerCase().includes(q)) continue;
      if (!groups.has(m.group)) groups.set(m.group, []);
      groups.get(m.group).push(m);
    }
    const nodes = [];
    for (const [name, models] of groups) {
      nodes.push(h("div", { class: "group-name" }, name));
      for (const m of models) {
        nodes.push(h("button", {
          class: "option" + (m.id === state.model ? " selected" : ""),
          "data-remote-action": true, "data-blocked": String(inFlight.has("model:")),
          onclick: () => command({ action: "model", model: m.id }, m.label + " 선택"),
        }, h("span", { class: "name" }, m.label), h("span", { class: "check" }, "✓")));
      }
    }
    if (!nodes.length) nodes.push(h("div", { class: "note", style: "padding:20px" }, "일치하는 모델이 없습니다."));
    $("model-list").replaceChildren(...nodes);
    syncConnection();
  }
  $("model-search").addEventListener("input", renderModels);

  function renderEfforts() {
    const efforts = [{ value: "", description: "runtime 설정 유지" }, ...(state?.efforts || [])];
    $("effort-list").replaceChildren(...efforts.map((e) => h("button", {
      class: "option" + (e.value === (state.effort || "") ? " selected" : ""),
      "data-remote-action": true, "data-blocked": String(inFlight.has("effort:")),
      onclick: () => command({ action: "effort", effort: e.value }),
    }, h("span", { class: "name" }, e.value || "기본", e.description ? h("div", { class: "hint", style: "font-size:12.5px;color:var(--muted)" }, e.description) : null), h("span", { class: "check" }, "✓"))));
    syncConnection();
  }

  $("model-chip").onclick = () => openSheet("model-sheet");
  $("effort-chip").onclick = () => openSheet("effort-sheet");
  $("menu-btn").onclick = () => openSheet("menu-sheet");
  $("refresh").onclick = () => location.reload();
  $("reconnect").onclick = () => location.reload();
  for (const item of document.querySelectorAll("[data-action]")) {
    item.onclick = () => {
      const kind = item.dataset.action;
      if (!connected || (kind === "new" && !confirm("새 대화를 시작할까요?"))) return;
      command({ action: kind }, kind === "new" ? "새 대화를 시작합니다" : "대화를 압축합니다");
    };
  }

  // ---- Composer ----
  function grow() { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, innerHeight * 0.34) + "px"; }
  text.addEventListener("input", () => { grow(); updateSend(); });
  text.addEventListener("keydown", (ev) => {
    const touch = matchMedia("(pointer: coarse)").matches;
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing && !touch) { ev.preventDefault(); $("form").requestSubmit(); }
  });
  async function sendMessage(message) {
    if (!connected || pending.some(p => p.request_id === message.request_id)) return;
    failedSends.delete(message.request_id);
    pending.push(message);
    render();
    try {
      await action({ action: "send", text: message.text, request_id: message.request_id });
      toast("메시지를 접수했습니다" + (state.queued > 0 ? " · 전송 대기 " + state.queued + "개" : ""));
    }
    catch (error) {
      message.error = error.message;
      failedSends.set(message.request_id, message);
      toast(error.message);
    } finally {
      pending = pending.filter(p => p !== message);
      render();
    }
  }
  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (!connected) return;
    const value = text.value.trim();
    if (!value) {
      if (state?.busy) command({ action: "interrupt" }, "중지를 요청했습니다");
      return;
    }
    text.value = "";
    grow();
    follow = true;
    sendMessage({ request_id: newId(), text: value });
  });
  scroller.addEventListener("scroll", () => {
    follow = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 60;
  }, { passive: true });

  // ---- Sync ----
  async function poll() {
    while (!expired) {
      try {
        const { res, data } = await fetchJson("/api/state?since=" + version + "&client=" + encodeURIComponent(client),
          { headers: { Authorization: "Bearer " + token } }, 30000);
        if (res.status === 401) {
          expireToken();
          return;
        }
        if (!res.ok) throw new Error(data.error || res.status);
        if (expired) return;
        const reconnected = !connected;
        connected = true;
        failures = 0;
        $("offline").classList.remove("show");
        if (!state || data.version !== version) {
          if (!data.state) throw new Error("Missing state");
          version = data.version; state = data.state; render();
        } else if (reconnected) render();
        else syncConnection();
      } catch (_) {
        if (expired) return;
        failures++;
        connected = false;
        if (state) render();
        else syncConnection();
        if (failures > 5) {
          $("offline-text").textContent = "Loom에 연결할 수 없습니다. 원격 조작이 꺼졌거나 컴퓨터가 잠들었을 수 있습니다.";
          $("offline").classList.add("show");
        }
        await new Promise((r) => setTimeout(r, Math.min(1000 * failures, 5000)));
      }
    }
  }
  syncConnection();
  if (!token) {
    $("offline-text").textContent = "접속 토큰이 없습니다. Loom에서 /remote로 표시된 QR 코드로 접속하세요.";
    $("offline").classList.add("show");
  } else poll();
})();
</script>
</body>
</html>
